<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EleGuard AI - Forest Department Surveillance Command</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b1329; color: #f1f5f9; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #1e293b; padding-bottom: 15px; }
        h1 { font-size: 24px; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
        .controls { display: flex; align-items: center; gap: 10px; }
        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .card { background: #152238; border: 1px solid #1e293b; border-radius: 10px; padding: 20px; }
        #map { height: 450px; border-radius: 8px; border: 1px solid #334155; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-card { background: #0b1329; padding: 15px; border-radius: 8px; text-align: center; }
        .stat-val { font-size: 26px; font-weight: bold; color: #38bdf8; margin-top: 5px; }
        .alert-banner { display: none; background: #dc2626; color: #fff; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { opacity: 0.85; } to { opacity: 1; transform: scale(1.005); } }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #1e293b; }
        th { color: #94a3b8; background: #0b1329; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-danger { background: #ef4444; color: white; }
        .badge-night { background: #6366f1; color: white; }
        .badge-day { background: #f97316; color: white; }
        .badge-safe { background: #10b981; color: white; }
        .btn { background: #0284c7; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 13px; font-weight: bold; }
        .btn:hover { background: #0369a1; }
        .btn-audio { background: #334155; }
        .btn-audio.active { background: #16a34a; }
        .btn-test { background: #dc2626; }
    </style>
</head>
<body>

    <header>
        <h1>🐘 EleGuard AI — Corridor Surveillance Command</h1>
        <div class="controls">
            <button id="audioToggle" class="btn btn-audio active" onclick="toggleAudio()">🔊 Siren: ON</button>
            <button class="btn btn-test" onclick="playSirenSound()">🚨 Test Sound</button>
            <span id="connStatus" class="badge badge-safe">BACKEND ONLINE</span>
            <a href="/export/csv" class="btn">Download CSV Report</a>
        </div>
    </header>

    <div id="alertBanner" class="alert-banner">
        🚨 CRITICAL INCIDENT ALERT: <span id="alertText">Elephant detected in Sevoke–Gulma rail corridor!</span>
    </div>

    <div class="grid">
        <div class="card">
            <h3 style="margin-bottom: 12px;">Corridor GIS Map (Sevoke–Gulma Belt)</h3>
            <div id="map"></div>
        </div>

        <div>
            <div class="stat-grid">
                <div class="stat-card">
                    <div>Total Sightings</div>
                    <div class="stat-val" id="totalCount">0</div>
                </div>
                <div class="stat-card">
                    <div>Peak Herd Size</div>
                    <div class="stat-val" id="peakHerd">0</div>
                </div>
            </div>

            <div class="card">
                <h3>Live Incident Log</h3>
                <div style="max-height: 360px; overflow-y: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>GPS</th>
                                <th>Mode</th>
                                <th>Herd</th>
                            </tr>
                        </thead>
                        <tbody id="sightingRows">
                            <tr><td colspan="4">Waiting for telemetry...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let audioEnabled = true;
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function toggleAudio() {
            const ctx = getAudioContext();
            audioEnabled = !audioEnabled;
            const btn = document.getElementById('audioToggle');
            if (audioEnabled) {
                btn.className = "btn btn-audio active";
                btn.innerText = "🔊 Siren: ON";
            } else {
                btn.className = "btn btn-audio";
                btn.innerText = "🔇 Siren: OFF";
            }
        }

        function playSirenSound() {
            if (!audioEnabled) return;
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = "sawtooth";
                const now = ctx.currentTime;
                osc.frequency.setValueAtTime(950, now);
                osc.frequency.exponentialRampToValueAtTime(450, now + 0.35);
                osc.frequency.exponentialRampToValueAtTime(950, now + 0.7);
                osc.frequency.exponentialRampToValueAtTime(450, now + 1.05);

                gain.gain.setValueAtTime(0.35, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 1.2);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(now);
                osc.stop(now + 1.2);
            } catch (e) {
                console.warn("Audio Context blocked:", e);
            }
        }

        // Map Initialization
        const map = L.map('map').setView([26.7271, 88.3953], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);
        let markers = [];

                function formatLocalTime(ts) {
            if (!ts) return new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
            const cleanTs = ts.endsWith('Z') ? ts : ts + 'Z';
            const d = new Date(cleanTs);
            if (isNaN(d.getTime())) {
                const localFallback = new Date(ts);
                return isNaN(localFallback.getTime()) ? ts : localFallback.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
            }
            return d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
        }

        async function loadIncidents() {
            try {
                const res = await fetch('/incidents');
                if (!res.ok) return;
                const data = await res.json();

                document.getElementById('totalCount').innerText = data.length;
                const maxHerd = data.reduce((m, item) => Math.max(m, item.elephant_count || 1), 0);
                document.getElementById('peakHerd').innerText = maxHerd;

                markers.forEach(m => map.removeLayer(m));
                markers = [];

                const tbody = document.getElementById('sightingRows');
                tbody.innerHTML = '';

                data.slice(0, 15).forEach((item, idx) => {
                    if (idx === 0) {
                        const m = L.circleMarker([item.latitude, item.longitude], {
                            color: '#ef4444',
                            fillColor: '#dc2626',
                            fillOpacity: 0.8,
                            radius: 9
                        }).addTo(map).bindPopup(`Elephant Count: ${item.elephant_count}`);
                        markers.push(m);
                    }

                    const isNight = item.source && item.source.toLowerCase().includes('night');
                    const modeBadge = isNight 
                        ? `<span class="badge badge-night">NIGHT IR</span>` 
                        : `<span class="badge badge-day">DAY</span>`;

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><strong>${formatLocalTime(item.timestamp)}</strong></td>
                        <td>${item.latitude.toFixed(3)}, ${item.longitude.toFixed(3)}</td>
                        <td>${modeBadge}</td>
                        <td><span class="badge badge-danger">${item.elephant_count}</span></td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                console.error("Dashboard sync error:", err);
            }
        }

        function triggerAlertVisual(data) {
            const banner = document.getElementById('alertBanner');
            const alertText = document.getElementById('alertText');
            alertText.innerText = `Herd of ${data.elephant_count || 1} spotted at (${data.latitude.toFixed(3)}, ${data.longitude.toFixed(3)})`;
            banner.style.display = 'block';

            playSirenSound();

            setTimeout(() => {
                banner.style.display = 'none';
            }, 6000);
        }

        // Auto-unlock audio on any user interaction
        document.body.addEventListener('click', getAudioContext, { once: true });

        // Connect WebSocket
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

        ws.onmessage = function(event) {
            try {
                const alertData = JSON.parse(event.data);
                triggerAlertVisual(alertData);
                loadIncidents();
            } catch (e) {
                console.error("WebSocket payload error:", e);
            }
        };

        ws.onclose = function() {
            document.getElementById('connStatus').className = "badge badge-danger";
            document.getElementById('connStatus').innerText = "DISCONNECTED";
        };

        setInterval(loadIncidents, 3000);
        loadIncidents();
    </script>
</body>
</html>
