<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EleGuard AI - Forest Department Surveillance Command</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b1329; color: #f1f5f9; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #1e293b; padding-bottom: 15px; }
        h1 { font-size: 24px; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
        .controls { display: flex; align-items: center; gap: 10px; }
        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .card { background: #152238; border: 1px solid #1e293b; border-radius: 10px; padding: 20px; }
        #map { height: 450px; border-radius: 8px; border: 1px solid #334155; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-card { background: #0b1329; padding: 15px; border-radius: 8px; text-align: center; }
        .stat-val { font-size: 26px; font-weight: bold; color: #38bdf8; margin-top: 5px; }
        .alert-banner { display: none; background: #dc2626; color: #fff; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { opacity: 0.85; } to { opacity: 1; transform: scale(1.005); } }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #1e293b; }
        th { color: #94a3b8; background: #0b1329; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-danger { background: #ef4444; color: white; }
        .badge-night { background: #6366f1; color: white; }
        .badge-safe { background: #10b981; color: white; }
        .btn { background: #0284c7; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 13px; font-weight: bold; }
        .btn:hover { background: #0369a1; }
        .btn-audio { background: #334155; }
    </style>
</head>
<body>

    <header>
        <h1>🐘 EleGuard AI — Corridor Surveillance Command</h1>
        <div class="controls">
            <button id="audioToggle" class="btn btn-audio" onclick="toggleAudio()">🔊 Siren: ON</button>
            <span id="connStatus" class="badge badge-safe">BACKEND ONLINE</span>
            <a href="/export/csv" class="btn">Download CSV Report</a>
        </div>
    </header>

    <div id="alertBanner" class="alert-banner">
        🚨 CRITICAL INCIDENT ALERT: <span id="alertText">Elephant herd detected in corridor!</span>
    </div>

    <div class="grid">
        <div class="card">
            <h3 style="margin-bottom: 12px;">Corridor GIS Map (Sevoke–Gulma Belt)</h3>
            <div id="map"></div>
        </div>

        <div>
            <div class="stat-grid">
                <div class="stat-card">
                    <div>Total Sightings</div>
                    <div class="stat-val" id="totalCount">0</div>
                </div>
                <div class="stat-card">
                    <div>Peak Herd Size</div>
                    <div class="stat-val" id="peakHerd">0</div>
                </div>
            </div>

            <div class="card">
                <h3>Live Incident Log</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>GPS</th>
                            <th>Mode</th>
                            <th>Herd</th>
                        </tr>
                    </thead>
                    <tbody id="sightingRows">
                        <tr><td colspan="4">Loading incidents...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_BASE = window.location.origin;
        let audioEnabled = true;

        // Web Audio API Synthesizer (Zero external assets needed)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSiren() {
            if (!audioEnabled) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            const btn = document.getElementById("audioToggle");
            btn.innerText = audioEnabled ? "🔊 Siren: ON" : "🔇 Siren: OFF";
            btn.style.background = audioEnabled ? "#334155" : "#475569";
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        // Map Setup
        const map = L.map('map').setView([26.735, 88.40], 12);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 18
        }).addTo(map);

        // Highlight Corridor Geofence Zone (Sevoke-Gulma Rail Sanctuary)
        const corridorBounds = [
            [26.70, 88.35],
            [26.77, 88.45]
        ];
        L.rectangle(corridorBounds, {
            color: "#f59e0b",
            weight: 1.5,
            fillOpacity: 0.1,
            dashArray: '5, 5'
        }).bindPopup("<b>High-Risk Geofence Corridor</b><br>Sevoke-Gulma Railway Belt").addTo(map);

        let markerGroup = L.layerGroup().addTo(map);

        async function updateMap() {
            try {
                const res = await fetch(`${API_BASE}/map/geojson`);
                const geo = await res.json();
                markerGroup.clearLayers();
                geo.features.forEach(f => {
                    const [lon, lat] = f.geometry.coordinates;
                    L.circleMarker([lat, lon], {
                        radius: 8,
                        fillColor: "#ef4444",
                        color: "#fff",
                        weight: 2,
                        fillOpacity: 0.85
                    }).bindPopup(`<b>Herd:</b> ${f.properties.elephant_count}<br><b>Source:</b> ${f.properties.source}`).addTo(markerGroup);
                });
            } catch(e) {}
        }

        async function refreshData() {
            try {
                const aRes = await fetch(`${API_BASE}/analytics/summary`);
                const aData = await aRes.json();
                document.getElementById('totalCount').innerText = aData.total_detections;
                document.getElementById('peakHerd').innerText = aData.peak_herd_size;

                const dRes = await fetch(`${API_BASE}/detections?limit=6`);
                const detections = await dRes.json();
                const tbody = document.getElementById('sightingRows');
                tbody.innerHTML = "";
                detections.forEach(d => {
                    const isNight = (d.source || '').includes('night') || (d.source || '').includes('ir');
                    const badgeClass = isNight ? 'badge-night' : 'badge-danger';
                    const modeLabel = isNight ? 'NIGHT IR' : 'DAY';
                    tbody.innerHTML += `
                        <tr>
                            <td>${new Date(d.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</td>
                            <td>${d.latitude.toFixed(3)}, ${d.longitude.toFixed(3)}</td>
                            <td><span class="badge ${badgeClass}">${modeLabel}</span></td>
                            <td><span class="badge badge-danger">${d.elephant_count}</span></td>
                        </tr>
                    `;
                });
            } catch(e) {}
        }

        // Real-Time Alert Event Listener
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socket = new WebSocket(`${wsProtocol}//${window.location.host}/ws/alerts`);
        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            const banner = document.getElementById("alertBanner");
            document.getElementById("alertText").innerText = `[${data.risk_level || 'CRITICAL'}] Herd spotted at (${data.latitude?.toFixed(3)}, ${data.longitude?.toFixed(3)})`;
            banner.style.display = "block";
            playSiren();
            setTimeout(() => { banner.style.display = "none"; }, 5000);
            updateMap();
            refreshData();
        };

        updateMap();
        refreshData();
        setInterval(refreshData, 6000);
    </script>
</body>
</html>
